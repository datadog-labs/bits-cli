<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authorization Successful</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #F9FAFB;
      background-image: radial-gradient(circle, #d1d5db 0.5px, transparent 0.5px);
      background-size: 12px 12px;
      color: #1a1a1a;
      position: relative;
      overflow: hidden;
    }
    .ellipse-1 {
      position: absolute;
      left: 20%;
      right: 50%;
      top: 50%;
      bottom: 20%;
      background: rgba(217, 222, 255, 0.9);
      filter: blur(50px);
      transform: matrix(0.9, -0.44, 0.56, 0.83, 0, 0);
      border-radius: 50%;
      z-index: 0;
    }
    .ellipse-2 {
      position: absolute;
      left: 55%;
      right: 15%;
      top: 20%;
      bottom: 50%;
      background: rgba(217, 222, 255, 0.9);
      filter: blur(50px);
      transform: matrix(0.9, -0.44, 0.56, 0.83, 0, 0);
      border-radius: 50%;
      z-index: 0;
    }
    .ellipse-3 {
      position: absolute;
      left: 40%;
      right: 40%;
      top: 40%;
      bottom: 40%;
      background: rgba(113, 184, 231, 0.3);
      filter: blur(50px);
      transform: matrix(0.9, -0.44, 0.56, 0.83, 0, 0);
      border-radius: 50%;
      z-index: 0;
    }
    .ellipse-4 {
      position: absolute;
      left: 15%;
      right: 55%;
      top: 20%;
      bottom: 50%;
      background: rgba(113, 184, 231, 0.3);
      filter: blur(50px);
      transform: matrix(0.9, -0.44, 0.56, 0.83, 0, 0);
      border-radius: 50%;
      z-index: 0;
    }
    .container {
      padding: 24px 80px 48px 80px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      animation: slideUp 0.4s ease-out;
      position: relative;
      z-index: 1;
    }
    .container::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      padding: 2px;
      background: conic-gradient(
        from var(--angle),
        #C2C8DD 0deg,
        #E2E5ED 90deg,
        #C2C8DD 180deg,
        #E2E5ED 270deg,
        #C2C8DD 360deg
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderRotate 8s linear infinite;
      z-index: -1;
    }
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes borderRotate {
      from {
        --angle: 0deg;
      }
      to {
        --angle: 360deg;
      }
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
    }
    .header-logo {
      width: 24px;
      height: 24px;
    }
    .header-text {
      font-family: 'Noto Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: rgba(28, 43, 52, 0.68);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .status-icon {
      display: block;
      margin: 0 auto;
      width: 60px;
      height: 60px;
    }
    .content {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .text-content {
      text-align: center;
      flex: 1;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    h1 {
      font-size: 32px;
      font-weight: 600;
      font-family: 'Noto Sans', sans-serif;
      color: rgba(28, 43, 52, 0.97);
      margin: 0 0 8px 0;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 15px;
      font-family: 'Noto Sans', sans-serif;
      color: rgba(28, 43, 52, 0.68);
      line-height: 1.5;
      margin: 0;
    }
    .countdown-line {
      color: rgba(28, 43, 52, 0.68);
    }
  </style>
</head>

        <h1>Authorization successful</h1>
        <p>You can close this window and return to Bits CLI.<br><span class="countdown-line" id="close-status">This tab will try to close automatically in <span id="countdown">10</span> seconds.</span></p>

  <script>
    (function() {
      var el = document.getElementById('countdown');
      var status = document.getElementById('close-status');
      var sec = 10;
      var t = setInterval(function() {
        sec--;
        if (el) el.textContent = Math.max(0, sec);
        if (sec <= 0) {
          clearInterval(t);
          window.close();
          setTimeout(function() {
            if (!window.closed && status) {
              status.textContent = 'You can safely close this tab.';
            }
          }, 500);
        }
      }, 1000);
    })();
  </script>
