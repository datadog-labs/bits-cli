include:
  - local: .adms/go/gitlab.yaml
variables:
  GIT_DEPTH: 1
  GIT_BASE_BRANCH: main
  GO_IMAGE: registry.ddbuild.io/images/mirror/golang:1.27.0
  GOTOOLCHAIN: local

stages:
  - lint
  - build
  - benchmark
  - publish

lint:
  stage: lint
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  before_script:
    - GOLANGCI_LINT_VERSION="v2.13.2"
    - GOLANGCI_LINT_RELEASE="2.13.2"
    - GOLANGCI_LINT_URL="https://depot-read-api-github-releases.us1.ddbuild.io/internal/mirror/github-releases/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
    - curl -fsSL "${GOLANGCI_LINT_URL}/golangci-lint-${GOLANGCI_LINT_RELEASE}-linux-arm64.tar.gz" -o /tmp/golangci-lint.tar.gz
    - curl -fsSL "${GOLANGCI_LINT_URL}/golangci-lint-${GOLANGCI_LINT_RELEASE}-checksums.txt" -o /tmp/golangci-lint-checksums.txt
    - grep "golangci-lint-${GOLANGCI_LINT_RELEASE}-linux-arm64.tar.gz$" /tmp/golangci-lint-checksums.txt | sed 's#  .*#  /tmp/golangci-lint.tar.gz#' | sha256sum -c -
    - mkdir -p /tmp/golangci-lint
    - tar -xzf /tmp/golangci-lint.tar.gz -C /tmp/golangci-lint --strip-components=1
    - install /tmp/golangci-lint/golangci-lint /usr/local/bin/golangci-lint
  script:
    - ./scripts/lint.sh
  rules:
    - when: always

test:
  stage: lint
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  script:
    - ./scripts/test.sh
  rules:
    - when: always

build:
  stage: build
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: [amd64, arm64]
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: windows
        GOARCH: [amd64, arm64]
  script:
    - ./scripts/build.sh
  artifacts:
    expire_in: 2 weeks
    paths:
      - build/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
      when: never
    - when: always

publish-to-dogbrew:
  stage: publish
  image: $GO_IMAGE
  tags:
    - arch:amd64
  variables:
    ADMS_TARGET: ci
  before_script:
    - VERSION="$(./scripts/version.sh)"
    - mkdir -p dist
    - for platform in darwin/arm64 linux/amd64 linux/arm64; do GOOS="${platform%/*}" GOARCH="${platform#*/}" BUILD_DIR=dist VERSION="${VERSION}" ./scripts/build.sh; done
  script:
    - ./scripts/dogbrew.sh --version "${VERSION}" --dist-dir dist --target "${ADMS_TARGET}" --publish
  artifacts:
    paths:
      - dist/bits-*.tar.gz
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
      when: manual
    - when: never

tui-benchmarks:
  stage: benchmark
  image: $GO_IMAGE
  tags:
    - arch:arm64
  allow_failure: true
  timeout: 10m
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  variables:
    DD_SITE: datadoghq.com
    DATADOG_CI_VERSION: v5.7.0
    DATADOG_CI_SHA256: dbab21348d32f94a33be49644dd1e866eccb74bd49cbb74800999b28f22253f6
    DD_STS_VERSION: v0.1.4
    GOMAXPROCS: "1"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_REQUEST: 2Gi
    KUBERNETES_MEMORY_LIMIT: 2Gi
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-bin"
    - curl -fsSL "https://binaries.ddbuild.io/dd-source/dd-sts/${DD_STS_VERSION}/dd-sts-tar.tar.gz" | tar -xz -C "$CI_PROJECT_DIR/.ci-bin" dd-sts-linux-arm64
    - mv "$CI_PROJECT_DIR/.ci-bin/dd-sts-linux-arm64" "$CI_PROJECT_DIR/.ci-bin/dd-sts"
    - curl -fsSL "https://depot-read-api-github-releases.us1.ddbuild.io/internal/mirror/github-releases/DataDog/datadog-ci/releases/download/${DATADOG_CI_VERSION}/datadog-ci_linux-arm64" -o "$CI_PROJECT_DIR/.ci-bin/datadog-ci"
    - echo "${DATADOG_CI_SHA256}  $CI_PROJECT_DIR/.ci-bin/datadog-ci" | sha256sum -c -
    - chmod +x "$CI_PROJECT_DIR/.ci-bin/datadog-ci"
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
  script:
    - go test ./... -run '^$' -bench . -benchmem -benchtime=500ms -count=7 -cpu=1 | tee benchmark.txt
    - go run ./tools/cibench -input benchmark.txt -output benchmark.json
    - dd-sts exchange --policy bits-cli-ci -- sh -c 'datadog-ci measure --level job --measures-file benchmark-measures.json && datadog-ci tag --level job --tags-file benchmark-tags.json'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - benchmark.txt
      - benchmark.json
      - benchmark-measures.json
      - benchmark-tags.json
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
      when: never
    - when: always
