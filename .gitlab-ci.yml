# Internal stable-tag release pipeline: strict stable tags only (see the
# workflow rules), producing trusted binaries from the internal network
# and holding the manual publish-to-dogbrew gate — the only Dogbrew
# publish path.

include:
  - local: .adms/go/gitlab.yaml
variables:
  GIT_DEPTH: 1
  GO_IMAGE: registry.ddbuild.io/images/mirror/golang:1.27.0
  GOTOOLCHAIN: go1.27.1

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
    - when: never

stages:
  - lint
  - build
  - publish

lint:
  stage: lint
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  before_script:
    - GOLANGCI_LINT_VERSION="v2.14.0"
    - GOLANGCI_LINT_RELEASE="2.14.0"
    - GOLANGCI_LINT_URL="https://depot-read-api-github-releases.us1.ddbuild.io/internal/mirror/github-releases/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
    - curl -fsSL "${GOLANGCI_LINT_URL}/golangci-lint-${GOLANGCI_LINT_RELEASE}-linux-arm64.tar.gz" -o /tmp/golangci-lint.tar.gz
    - curl -fsSL "${GOLANGCI_LINT_URL}/golangci-lint-${GOLANGCI_LINT_RELEASE}-checksums.txt" -o /tmp/golangci-lint-checksums.txt
    - grep "golangci-lint-${GOLANGCI_LINT_RELEASE}-linux-arm64.tar.gz$" /tmp/golangci-lint-checksums.txt | sed 's#  .*#  /tmp/golangci-lint.tar.gz#' | sha256sum -c -
    - mkdir -p /tmp/golangci-lint
    - tar -xzf /tmp/golangci-lint.tar.gz -C /tmp/golangci-lint --strip-components=1
    - install /tmp/golangci-lint/golangci-lint /usr/local/bin/golangci-lint
  script:
    - ./scripts/lint.sh

test:
  stage: lint
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  script:
    - ./scripts/test.sh

build:
  stage: build
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: [amd64, arm64]
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: windows
        GOARCH: [amd64, arm64]
  # The workflow gate guarantees a strict stable tag here, so every build of
  # this pipeline embeds the exact release version.
  script:
    - VERSION="$(./scripts/version.sh)" ./scripts/build.sh
  artifacts:
    expire_in: 2 weeks
    paths:
      - build/

publish-to-dogbrew:
  stage: publish
  image: registry.ddbuild.io/images/go:1.26.2-jammy
  tags:
    - arch:amd64
  variables:
    ADMS_TARGET: ci
  before_script:
    - VERSION="$(./scripts/version.sh)"
    - mkdir -p dist
    - for platform in darwin-arm64 linux-amd64 linux-arm64; do cp "build/bits-${platform}" "dist/bits-${platform}"; done
  script:
    - ./scripts/dogbrew.sh --version "${VERSION}" --dist-dir dist --target "${ADMS_TARGET}" --publish
  artifacts:
    paths:
      - dist/bits-*.tar.gz
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/'
      when: manual
    - when: never
