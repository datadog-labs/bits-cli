variables:
  GIT_DEPTH: 1
  GIT_BASE_BRANCH: main
  GO_IMAGE: registry.ddbuild.io/ci/dd-go:gbi-jammy@sha256:40d49aa83486b1cda5cf9ab6fa29576cbc16697b7aea00e1f6e22350a2314fca

stages:
  - lint
  - build
  - benchmark

lint:
  stage: lint
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  script:
    - ./scripts/lint.sh
  rules:
    - when: always

build:
  stage: build
  image: $GO_IMAGE
  tags:
    - arch:arm64
  timeout: 10m
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: [amd64, arm64]
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: windows
        GOARCH: [amd64, arm64]
  script:
    - ./scripts/build.sh
  artifacts:
    expire_in: 2 weeks
    paths:
      - build/
  rules:
    - when: always

tui-benchmarks:
  stage: benchmark
  image: $GO_IMAGE
  tags:
    - arch:arm64
  allow_failure: true
  timeout: 10m
  id_tokens:
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  variables:
    DD_SITE: datadoghq.com
    DATADOG_CI_VERSION: v5.7.0
    DATADOG_CI_SHA256: dbab21348d32f94a33be49644dd1e866eccb74bd49cbb74800999b28f22253f6
    DD_STS_VERSION: v0.1.4
    GOMAXPROCS: "1"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "1"
    KUBERNETES_MEMORY_REQUEST: 2Gi
    KUBERNETES_MEMORY_LIMIT: 2Gi
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.ci-bin"
    - curl -fsSL "https://binaries.ddbuild.io/dd-source/dd-sts/${DD_STS_VERSION}/dd-sts-tar.tar.gz" | tar -xz -C "$CI_PROJECT_DIR/.ci-bin" dd-sts-linux-arm64
    - mv "$CI_PROJECT_DIR/.ci-bin/dd-sts-linux-arm64" "$CI_PROJECT_DIR/.ci-bin/dd-sts"
    - curl -fsSL "https://depot-read-api-github-releases.us1.ddbuild.io/internal/mirror/github-releases/DataDog/datadog-ci/releases/download/${DATADOG_CI_VERSION}/datadog-ci_linux-arm64" -o "$CI_PROJECT_DIR/.ci-bin/datadog-ci"
    - echo "${DATADOG_CI_SHA256}  $CI_PROJECT_DIR/.ci-bin/datadog-ci" | sha256sum -c -
    - chmod +x "$CI_PROJECT_DIR/.ci-bin/datadog-ci"
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
  script:
    - go test ./... -run '^$' -bench . -benchmem -benchtime=500ms -count=7 -cpu=1 | tee benchmark.txt
    - go run ./tools/cibench -input benchmark.txt -output benchmark.json
    - dd-sts exchange --policy bits-cli-ci -- sh -c 'datadog-ci measure --level job --measures-file benchmark-measures.json && datadog-ci tag --level job --tags-file benchmark-tags.json'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - benchmark.txt
      - benchmark.json
      - benchmark-measures.json
      - benchmark-tags.json
  rules:
    - when: always
