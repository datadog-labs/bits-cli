# Unprivileged: read-only token and no secrets, so fork pull requests run the
# same checks. Also called by release.yml, which publishes the dist artifact
# built here for its tag.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, v<major>.<minor>.<patch>
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Cancel superseded pull request runs only; other runs get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  BITS_KEYRING_E2E: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache golangci-lint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.go.outputs.go-bin-path }}/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('scripts/lint.sh') }}
      - name: Lint
        run: ./scripts/lint.sh --all-platforms --require-shellcheck

  # Each OS builds its release targets natively, tests against the built
  # helpers, and hands the install prefixes over to the package job.
  build:
    name: Build ${{ matrix.goos }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            runner: ubuntu-latest
            targets: linux/amd64 linux/arm64
          - goos: darwin
            runner: macos-latest
            targets: darwin/amd64 darwin/arm64
          - goos: windows
            runner: windows-latest
            targets: windows/amd64 windows/arm64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds never restore a cache written by other runs.
          cache: ${{ !inputs.tag }}
      - name: Build
        env:
          TAG: ${{ inputs.tag || 'v0.0.0' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<<"$TARGETS"
          VERSION="${TAG#v}" ./scripts/build.sh "${targets[@]}"
          host="build/$(go env GOOS)-$(go env GOARCH)"
          "$host/bin/bits" --version
          if [[ -d "$host/libexec/bits" ]]; then
            echo "BITS_LIBEXEC_DIR=$PWD/$host/libexec/bits" >>"$GITHUB_ENV"
          fi
      - name: Set up test keychain
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/bits-cli-test.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
      - name: Test
        run: ./scripts/test.sh
      # Artifacts drop file modes, so the prefixes travel as a tar.
      - name: Archive install prefixes
        env:
          COPYFILE_DISABLE: "1"
          GOOS: ${{ matrix.goos }}
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<<"$TARGETS"
          tar -cf "prefixes-$GOOS.tar" -C build "${targets[@]/\//-}"
      - name: Upload install prefixes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prefixes-${{ matrix.goos }}
          path: prefixes-${{ matrix.goos }}.tar
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download install prefixes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prefixes-*
          merge-multiple: true
          path: prefixes
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Package release archives and SBOMs
        env:
          TAG: ${{ inputs.tag || 'v0.0.0' }}
        run: |
          mkdir build
          for prefixes in prefixes/*.tar; do tar -xf "$prefixes" -C build; done
          ./scripts/package.sh --sbom "$TAG"
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The single check required to merge: it fails unless every job above
  # succeeded, so adding a job only means listing it here.
  ci:
    name: CI
    if: always()
    needs: [lint, build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "required jobs did not all succeed: $RESULTS" >&2
              exit 1
            fi
          done
