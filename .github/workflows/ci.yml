# Unprivileged by design — no secrets, read-only permissions, public tools
# and module downloads only — so fork pull requests run the same checks
# without trust escalation. Dogbrew publishing stays on the internal GitLab
# stable-tag pipeline (see RELEASE.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A glob cannot express "no leading zeroes", so every v-prefixed tag
    # reaches the workflow and the resolve-release steps validate strictly.
    tags: ['v*']
  merge_group:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: ./scripts/test.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve release version
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          if version="$(./scripts/version.sh 2>/dev/null)"; then
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          else
            printf 'not a stable release tag; building dev binary\n' >&2
          fi
      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          binary="$(./scripts/build.sh)"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bits-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          retention-days: 14
          if-no-files-found: error

  dogbrew-tarballs:
    name: Dogbrew tarballs
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: release
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          if version="$(./scripts/version.sh 2>/dev/null)"; then
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
            printf 'is-release=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'is-release=false\n' >> "$GITHUB_OUTPUT"
            printf 'skipping Dogbrew packaging: %s is not a stable release tag\n' \
              "${GITHUB_REF_NAME}" >&2
          fi
      # Artifact upload/download normalizes file modes to 0644, so the
      # executable bit must be restored before packaging.
      - name: Download binaries
        if: steps.release.outputs.is-release == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: bits-*
          merge-multiple: true
      # No --publish: nothing fork-visible can reach the Dogbrew publisher
      # from Actions.
      - name: Package Dogbrew tarballs
        if: steps.release.outputs.is-release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for platform in darwin-arm64 linux-amd64 linux-arm64; do
            chmod 0755 "dist/bits-${platform}"
          done
          ./scripts/dogbrew.sh --version "$VERSION" --dist-dir dist
      - name: Upload Dogbrew tarballs
        if: steps.release.outputs.is-release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogbrew-tarballs-v${{ steps.release.outputs.version }}
          path: dist/bits-*.tar.gz
          retention-days: 7
          if-no-files-found: error
