# CI for ordinary development and release-tag builds.
#
# Runs lint, tests, and the six-target build matrix for every pull request,
# main push, queued merge, and v-prefixed tag push. On strict stable tags
# (v<major>.<minor>.<patch>, no leading zeroes) it also packages the Dogbrew
# platform tarballs as workflow artifacts — without publishing them.
#
# Trust boundary: this workflow also runs for fork pull requests, so it uses
# no secrets, no write or id-token permissions, and only public tools and
# module downloads. The internal Dogbrew publish remains on the GitLab
# stable-tag pipeline (see .gitlab-ci.yml and RELEASE.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A glob cannot express "no leading zeroes", so every v-prefixed tag
    # reaches the workflow and the resolve-release steps validate strictly;
    # non-stable tags (pre-releases, v01.2.3, ...) build dev binaries only.
    tags: ['v*']
  merge_group:

permissions:
  contents: read

concurrency:
  # Superseded runs on the same PR/ref are canceled.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitLab runners inherit an internal Go proxy through .adms/go/go.env;
  # pin the public proxy and checksum DB explicitly so module downloads on
  # GitHub-hosted runners never depend on internal infrastructure.
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # scripts/lint.sh also lints the nested tools/licenses module and
      # checks LICENSE-3rdparty.csv for drift.
      - name: Lint
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: ./scripts/test.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Only tag refs can become releases; scripts/version.sh then rejects
      # anything that is not a strict v<major>.<minor>.<patch> stable tag,
      # so branch and pull-request names never masquerade as releases.
      - name: Resolve release version
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          if version="$(./scripts/version.sh 2>/dev/null)"; then
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          else
            printf 'not a stable release tag; building dev binary\n' >&2
          fi
      # A validated VERSION embeds the exact release version; an empty one
      # keeps the dev VCS version stamped by the Go toolchain.
      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          binary="$(./scripts/build.sh)"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bits-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          retention-days: 14
          if-no-files-found: error

  dogbrew-tarballs:
    name: Dogbrew tarballs
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same strict tag validation as the build job: non-stable v tags skip
      # packaging entirely instead of producing publish-looking tarballs.
      - name: Resolve release version
        id: release
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
        run: |
          if version="$(./scripts/version.sh 2>/dev/null)"; then
            printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
            printf 'is-release=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'is-release=false\n' >> "$GITHUB_OUTPUT"
            printf 'skipping Dogbrew packaging: %s is not a stable release tag\n' \
              "${GITHUB_REF_NAME}" >&2
          fi
      # Artifact upload/download normalizes file modes to 0644, so the
      # executable bit must be restored before packaging.
      - name: Download binaries
        if: steps.release.outputs.is-release == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: bits-*
          merge-multiple: true
      # Packages the three Dogbrew platform tarballs without --publish: no
      # internal ADMS or Dogbrew network access happens from Actions.
      - name: Package Dogbrew tarballs
        if: steps.release.outputs.is-release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for platform in darwin-arm64 linux-amd64 linux-arm64; do
            chmod 0755 "dist/bits-${platform}"
          done
          ./scripts/dogbrew.sh --version "$VERSION" --dist-dir dist
      - name: Upload Dogbrew tarballs
        if: steps.release.outputs.is-release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogbrew-tarballs-v${{ steps.release.outputs.version }}
          path: dist/bits-*.tar.gz
          retention-days: 7
          if-no-files-found: error
