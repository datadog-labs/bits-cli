# Publishes a GitHub release of main, triggered by scripts/release.sh. The
# GITHUB_TOKEN stays read-only: the dist job signs and notarizes the macOS
# binaries with credentials from a protected environment, and the publish
# job creates the release and its tag with a dd-octo-sts token, once CI
# passed.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, the next v<major>.<minor>.<patch>
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  check:
    name: Check tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        env:
          TAG: ${{ inputs.tag }}
        run: ./scripts/release.sh --check "$TAG"

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml

  dist:
    name: Dist
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the Apple signing credentials; only main and tags can use it.
    environment: protected-main-env
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release archives
        env:
          TAG: ${{ inputs.tag }}
          QUILL_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./scripts/dist.sh --sign "$TAG"
      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [ci, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/bits_*.tar.gz
      - name: Get release token
        id: octo-sts
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: datadog-labs/bits-cli
          policy: self.release
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: ./scripts/publish.sh "$TAG"
